<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job | HireLoop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .apply-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 2.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 600;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }
        .success-box {
            display: none;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="apply-container card">
        <h1 style="text-align: center; margin-bottom: 0.5rem;">Join the Team</h1>
        <p class="subtitle" style="text-align: center; margin-bottom: 2rem;">Please fill out the form below to submit your application.</p>
        
        <form id="apply-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            
            <div class="form-group">
                <label for="contact_number">Contact Number</label>
                <input type="text" id="contact_number" name="contact_number" placeholder="+1 (555) 000-0000">
            </div>
            
            <div class="form-group">
                <label for="resume_text">Resume / Experience</label>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Please paste your resume or describe your experience.</p>
                <textarea id="resume_text" name="resume_text" rows="10" required placeholder="I am an experienced professional..."></textarea>
            </div>
            
            <button type="submit" class="primary-btn" style="width: 100%; margin-top: 1rem; font-size: 1.1rem; padding: 1rem;" id="submit-btn">Submit Application</button>
        </form>
        
        <div class="success-box" id="success-box">
            <h2 style="color: #10b981; margin-bottom: 0.5rem;">Application Submitted!</h2>
            <p>Thank you for applying. Our hiring team will review your application and get back to you shortly.</p>
        </div>
    </main>

    <script>
        const form = document.getElementById('apply-form');
        const submitBtn = document.getElementById('submit-btn');
        const successBox = document.getElementById('success-box');
        
        // This comes from the Flask template
        const jobId = "{{ job_id }}";
        // Assuming backend is on port 8000
        const BACKEND_URL = "http://127.0.0.1:8000";

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                contact_number: document.getElementById('contact_number').value,
                resume_text: document.getElementById('resume_text').value
            };
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/apply/${jobId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    form.style.display = 'none';
                    successBox.style.display = 'block';
                } else {
                    alert('Error submitting application. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Application';
                }
            } catch (err) {
                console.error(err);
                alert('Network error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Application';
            }
        });
    </script>
</body>
</html>
