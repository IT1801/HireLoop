<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>HireLoop AI - System Initialization</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        /* Custom Input Underline Animation */
        .cyber-input {
            position: relative;
        }
        .cyber-input::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 1px;
            background-color: #10b981; /* primary-container */
            transition: width 0.3s ease;
        }
        .cyber-input:focus-within::after {
            width: 100%;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(12, 18, 26, 0.7); /* Level 1 Obsidian with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.2); /* 20% Emerald border */
        }
        
        .glass-panel-hover:hover {
            border: 1px solid rgba(16, 185, 129, 1);
            box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.1);
        }

        /* Scanline texture */
        .scanlines {
            background-image: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.1) 50%,
                rgba(0, 0, 0, 0.1)
            );
            background-size: 100% 4px;
        }

        /* Glowing Dot Animation */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .status-dot {
            animation: pulse-glow 2s infinite;
        }

        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f1419; }
        ::-webkit-scrollbar-thumb { background: #31353b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary": "#68dba9",
                        "secondary-fixed-dim": "#45dfa4",
                        "surface-dim": "#0f1419",
                        "on-primary": "#003824",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#262a30",
                        "on-secondary-fixed": "#002114",
                        "on-tertiary-fixed": "#002114",
                        "inverse-surface": "#dfe3ea",
                        "on-error": "#690005",
                        "primary": "#4edea3",
                        "secondary": "#45dfa4",
                        "primary-fixed-dim": "#4edea3",
                        "on-background": "#dfe3ea",
                        "tertiary-fixed-dim": "#68dba9",
                        "error-container": "#93000a",
                        "background": "#0f1419",
                        "surface-container": "#1b2025",
                        "primary-container": "#10b981",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#005137",
                        "on-surface": "#dfe3ea",
                        "on-secondary-container": "#00452e",
                        "surface-variant": "#31353b",
                        "on-surface-variant": "#bbcabf",
                        "on-primary-fixed-variant": "#005236",
                        "outline-variant": "#3c4a42",
                        "secondary-fixed": "#68fcbf",
                        "inverse-on-surface": "#2c3137",
                        "tertiary-fixed": "#85f8c4",
                        "inverse-primary": "#006c49",
                        "surface-container-low": "#171c21",
                        "primary-fixed": "#6ffbbe",
                        "surface-tint": "#4edea3",
                        "on-secondary-fixed-variant": "#005137",
                        "tertiary-container": "#3eb686",
                        "on-secondary": "#003825",
                        "surface": "#0f1419",
                        "surface-bright": "#353a3f",
                        "on-primary-container": "#00422b",
                        "on-primary-fixed": "#002113",
                        "on-tertiary-container": "#00422c",
                        "on-tertiary": "#003825",
                        "surface-container-lowest": "#0a0f14",
                        "surface-container-highest": "#31353b",
                        "secondary-container": "#00bd85",
                        "outline": "#86948a"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "gutter": "24px",
                        "container-max": "1280px",
                        "unit": "4px",
                        "margin-desktop": "64px",
                        "margin-mobile": "20px"
                    },
                    fontFamily: {
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "mono-label": ["Courier Prime"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                        "display-lg-mobile": ["32px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "800" }],
                        "mono-label": ["14px", { lineHeight: "1.4", fontWeight: "400" }],
                        "label-caps": ["12px", { lineHeight: "1.2", letterSpacing: "0.1em", fontWeight: "600" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "800" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center relative overflow-y-auto font-body-md py-4 md:py-8">
<!-- Background Animation Layer -->
<div class="absolute inset-0 z-0 opacity-30 pointer-events-none mix-blend-screen">
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-2xl px-margin-mobile md:px-0">
<!-- Header Section -->
<header class="text-center mb-6">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface">
                One Time Setup</h1>
</header>
<!-- Glassmorphic Card Form Container -->
<div class="glass-panel rounded-xl p-6 md:p-8 relative overflow-hidden shadow-[0_0_40px_rgba(16,185,129,0.05)]">
<!-- Scanline overlay for CRT effect -->
<div class="absolute inset-0 scanlines pointer-events-none opacity-20"></div>
<!-- Form Content -->
<form class="relative z-10 space-y-6" method="POST" action="{{ url_for('setup') }}">
{% if error %}
<div class="bg-error/10 border border-error text-error px-4 py-3 rounded-lg font-body-sm shadow-[0_0_10px_rgba(255,180,171,0.2)]">
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">error</span>
        {{ error }}
    </div>
</div>
{% endif %}
<div class="space-y-4">
<div class="space-y-3">
<div class="cyber-input">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 text-on-surface focus:outline-none focus:border-primary-container focus:ring-0 transition-colors font-body-md" id="fullName" name="name" placeholder="Ishan" type="text" required>
</div>
<div class="cyber-input">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase" for="companyName">Company Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 text-on-surface focus:outline-none focus:border-primary-container focus:ring-0 transition-colors font-body-md" id="companyName" name="company_name" placeholder="Acme Corp" type="text">
</div>
<div class="cyber-input">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase" for="phone">Contact information</label>
<div class="flex">
<span class="inline-flex items-center px-4 rounded-l bg-surface-container-high border border-r-0 border-outline-variant text-on-surface-variant font-mono-label">+91</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-r p-3 text-on-surface focus:outline-none focus:border-primary-container focus:ring-0 transition-colors font-body-md" id="phone" name="phone" placeholder="95XXX XXXXX " type="tel" required>
</div>
</div>
</div>
<div class="pt-4 border-t border-outline-variant/30">

<div class="space-y-3">
<div class="space-y-1">
  <button onclick="window.location.href='http://127.0.0.1:8000/auth/google/login?company_id={{ session.get('company_id') }}'" class="w-full glass-panel glass-panel-hover rounded p-3 flex items-center justify-center gap-3 transition-all duration-300 group relative" type="button">
    <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
    </svg>
    <span class="font-label-caps text-label-caps uppercase text-on-surface group-hover:text-primary transition-colors">Google AUTHENTICATION</span>
    {% if has_google %}
    <span class="absolute right-4 top-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
    {% endif %}
  </button>
  <p class="text-xs text-on-surface-variant px-2 opacity-80 mt-1">Authenticate with the Google account that will be used to send automated emails to candidates.</p>
</div>
<div class="space-y-1">
  <button onclick="window.location.href='http://127.0.0.1:8000/auth/linkedin/login?company_id={{ session.get('company_id') }}'" class="w-full glass-panel glass-panel-hover rounded p-3 flex items-center justify-center gap-3 transition-all duration-300 group relative" type="button">
    <span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">work</span>
    <span class="font-label-caps text-label-caps uppercase text-on-surface group-hover:text-primary transition-colors">LinkedIn AUTHENTICATION</span>
    {% if has_linkedin %}
    <span class="absolute right-4 top-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
    {% endif %}
  </button>
  <p class="text-xs text-on-surface-variant px-2 opacity-80 mt-1">Authenticate with the LinkedIn account that will be used for publishing job postings.</p>
</div>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-primary-container hover:bg-primary text-black font-headline-md text-body-md py-3 rounded transition-all duration-300 flex justify-center items-center gap-2 hover:shadow-[0_0_15px_rgba(16,185,129,0.5)]" type="submit">Finish Setup&nbsp;<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
</button>
</div>
</div>
</form>
</div>
</main>


</body></html>
